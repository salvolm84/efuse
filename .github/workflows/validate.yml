# Re-checks the stored simulation results and the documentation.
# LTspice does not run here: the results in docs/results.json come from the
# last local run (tools/run_ltspice.sh, then tools/validate.py --export).
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python dependencies
        run: pip install numpy
      - name: Repeat all checks from the stored results
        run: python3 tools/validate.py --json docs/results.json
      - name: The committed validation report matches the results
        run: git diff --exit-code docs/VALIDATION.md
      - name: The numbers quoted in the docs match the results
        run: python3 tools/sync_docs.py --json docs/results.json --check
